org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# --- Tree SDK resolution: local publish, no JitPack token ---
# tree_sdk_flutter's android/build.gradle.kts resolves
#   com.github.DRUApp.android-tree-sdk:treesdk:${treeSdkVersion}
# and defaults treeSdkVersion to a real tag (v0.4.0 as of plugin 0.5.0), which normally comes
# from JitPack — and JitPack needs a token, because DRUApp/android-tree-sdk is private.
#
# We skip JitPack entirely by pointing treeSdkVersion at the version android-tree-sdk's
# treesdk/build.gradle.kts publishes to mavenLocal ("main-SNAPSHOT"), which the plugin's own
# mavenLocal() entry then resolves. This is the override its README calls out for local SDK work.
#
# Consequence worth knowing: this builds against YOUR LOCAL android-tree-sdk working tree, not a
# released tag. Re-run ../tools/publish_local_sdk.sh after every change to the native SDK, or
# this app keeps linking the previously published snapshot.
#
# To build against the real v0.4.0 tag instead, delete this line and put a JitPack token in
# ~/.gradle/gradle.properties as `jitpackToken=...`.
treeSdkVersion=main-SNAPSHOT
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
