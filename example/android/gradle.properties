org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# --- Tree SDK resolution: local publish, no JitPack token ---
# tree_sdk_flutter's Android side depends on
#   com.github.DRUApp.android-tree-sdk:treesdk:${treeSdkVersion}   (default: main-SNAPSHOT)
# and would normally fetch it from JitPack, which needs a token because DRUApp/android-tree-sdk
# is private. This project skips that: android/build.gradle.kts puts mavenLocal() ahead of
# JitPack, and android-tree-sdk publishes those exact coordinates locally with
#   ./gradlew :treesdk:publishToMavenLocal
# Leaving treeSdkVersion unset keeps the default "main-SNAPSHOT", which is exactly the version
# that local publication uses — so nothing to pin here.
#
# If you ever DO switch to JitPack instead, put a token in ~/.gradle/gradle.properties as
# `jitpackToken=...` (never commit it here) and optionally pin `treeSdkVersion=<tag>`.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
