distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 8.14.x, not 8.13: Flutter's Gradle plugin enforces a minimum of 8.14.0.
# Staying on the 8.x line is deliberate — AGP 8.12.3 (see settings.gradle.kts) does not
# support Gradle 9, and AGP must stay on 8.x because the Flutter app module and the
# tree_sdk_flutter plugin both apply the org.jetbrains.kotlin.android plugin, which AGP 9
# rejects outright.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
